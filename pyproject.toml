[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chrom-alphagenome"
version = "0.2.1"
description = "Multi-modal non-coding variant prioritization, chromatin accessibility modeling, and Sashimi splice-disruption analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Abdullah Azmi", email = "erlokix@gmail.com" }
]
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
